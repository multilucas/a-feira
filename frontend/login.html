<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Feira - Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class'
        }
    </script>
</head>
<body class="bg-white dark:bg-gray-900 text-gray-900 dark:text-white transition-colors">
    <div class="min-h-screen flex items-center justify-center p-4">
        <div class="w-full max-w-md">
            <!-- Logo/Header -->
            <div class="text-center mb-8">
                <h1 class="text-4xl font-bold text-indigo-600">🛒 A Feira</h1>
                <p class="text-gray-600 dark:text-gray-400 mt-2">Gerenciador de Lista de Compras</p>
            </div>

            <!-- Container de Formulário -->
            <div class="bg-white dark:bg-gray-800 rounded-lg shadow-lg p-8">
                <!-- Tabs -->
                <div class="flex gap-4 mb-8 border-b border-gray-300 dark:border-gray-700">
                    <button id="tabLogin" onclick="switchTab('login')" class="pb-4 font-bold text-indigo-600 border-b-2 border-indigo-600 flex-1">
                        Login
                    </button>
                    <button id="tabRegister" onclick="switchTab('register')" class="pb-4 font-medium text-gray-600 dark:text-gray-400 border-b-2 border-transparent flex-1 hover:border-gray-300 dark:hover:border-gray-700">
                        Registrar
                    </button>
                </div>

                <!-- Login Form -->
                <form id="formLogin" class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium mb-1">Email</label>
                        <input type="email" id="loginEmail" required class="w-full p-3 border border-gray-300 dark:border-gray-600 dark:bg-gray-700 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-600" placeholder="seu@email.com">
                    </div>
                    <div>
                        <label class="block text-sm font-medium mb-1">Senha</label>
                        <input type="password" id="loginPassword" required class="w-full p-3 border border-gray-300 dark:border-gray-600 dark:bg-gray-700 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-600" placeholder="••••••">
                    </div>
                    <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 rounded-lg transition">
                        Entrar
                    </button>
                    <p id="loginError" class="text-red-500 text-sm hidden"></p>
                </form>

                <!-- Register Form -->
                <form id="formRegister" class="space-y-4 hidden">
                    <div>
                        <label class="block text-sm font-medium mb-1">Email</label>
                        <input type="email" id="registerEmail" required class="w-full p-3 border border-gray-300 dark:border-gray-600 dark:bg-gray-700 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-600" placeholder="seu@email.com">
                    </div>
                    <div>
                        <label class="block text-sm font-medium mb-1">Senha</label>
                        <input type="password" id="registerPassword" required class="w-full p-3 border border-gray-300 dark:border-gray-600 dark:bg-gray-700 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-600" placeholder="Mínimo 6 caracteres">
                    </div>
                    <div>
                        <label class="block text-sm font-medium mb-1">Confirmar Senha</label>
                        <input type="password" id="registerPasswordConfirm" required class="w-full p-3 border border-gray-300 dark:border-gray-600 dark:bg-gray-700 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-600" placeholder="Repita a senha">
                    </div>
                    <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 rounded-lg transition">
                        Criar Conta
                    </button>
                    <p id="registerError" class="text-red-500 text-sm hidden"></p>
                </form>

                <!-- Theme Toggle -->
                <button onclick="toggleTheme()" class="mt-6 w-full text-center p-3 text-sm text-gray-600 dark:text-gray-400 border border-gray-300 dark:border-gray-700 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-700 transition">
                    <span id="themeLabel">🌙 Modo Escuro</span>
                </button>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = `${window.location.protocol}//${window.location.host}/api`;

        // Theme
        function initTheme() {
            const isDark = localStorage.getItem('theme') === 'dark';
            if (isDark) {
                document.documentElement.classList.add('dark');
                updateThemeLabel(true);
            }
        }

        function toggleTheme() {
            const isDark = document.documentElement.classList.toggle('dark');
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
            updateThemeLabel(isDark);
        }

        function updateThemeLabel(isDark) {
            document.getElementById('themeLabel').textContent = isDark ? '☀️ Modo Claro' : '🌙 Modo Escuro';
        }

        // Tab Switching
        function switchTab(tab) {
            const forms = ['formLogin', 'formRegister'];
            const tabs = ['tabLogin', 'tabRegister'];

            forms.forEach(form => document.getElementById(form).classList.add('hidden'));
            tabs.forEach(tab => {
                document.getElementById(tab).classList.remove('border-indigo-600', 'text-indigo-600', 'font-bold');
                document.getElementById(tab).classList.add('text-gray-600', 'dark:text-gray-400', 'font-medium', 'border-transparent');
            });

            if (tab === 'login') {
                document.getElementById('formLogin').classList.remove('hidden');
                document.getElementById('tabLogin').classList.add('border-indigo-600', 'text-indigo-600', 'font-bold');
                document.getElementById('tabLogin').classList.remove('text-gray-600', 'dark:text-gray-400', 'font-medium', 'border-transparent');
            } else {
                document.getElementById('formRegister').classList.remove('hidden');
                document.getElementById('tabRegister').classList.add('border-indigo-600', 'text-indigo-600', 'font-bold');
                document.getElementById('tabRegister').classList.remove('text-gray-600', 'dark:text-gray-400', 'font-medium', 'border-transparent');
            }
        }

        // Login
        document.getElementById('formLogin').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;
            const errorDiv = document.getElementById('loginError');

            try {
                const response = await fetch(`${API_BASE}/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'include',
                    body: JSON.stringify({ email, password })
                });

                const data = await response.json();

                if (response.ok) {
                    localStorage.setItem('theme', data.user.theme);
                    if (data.user.theme === 'dark') {
                        document.documentElement.classList.add('dark');
                    } else {
                        document.documentElement.classList.remove('dark');
                    }
                    window.location.href = '/';
                } else {
                    errorDiv.textContent = data.error;
                    errorDiv.classList.remove('hidden');
                }
            } catch (error) {
                errorDiv.textContent = 'Erro ao conectar';
                errorDiv.classList.remove('hidden');
            }
        });

        // Register
        document.getElementById('formRegister').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('registerEmail').value;
            const password = document.getElementById('registerPassword').value;
            const confirm = document.getElementById('registerPasswordConfirm').value;
            const errorDiv = document.getElementById('registerError');

            if (password !== confirm) {
                errorDiv.textContent = 'As senhas não coincidem';
                errorDiv.classList.remove('hidden');
                return;
            }

            if (password.length < 6) {
                errorDiv.textContent = 'Senha deve ter mínimo 6 caracteres';
                errorDiv.classList.remove('hidden');
                return;
            }

            try {
                const response = await fetch(`${API_BASE}/auth/register`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'include',
                    body: JSON.stringify({ email, password })
                });

                const data = await response.json();

                if (response.ok) {
                    window.location.href = '/';
                } else {
                    errorDiv.textContent = data.error;
                    errorDiv.classList.remove('hidden');
                }
            } catch (error) {
                errorDiv.textContent = 'Erro ao conectar';
                errorDiv.classList.remove('hidden');
            }
        });

        // Initialize
        initTheme();
    </script>
</body>
</html>
